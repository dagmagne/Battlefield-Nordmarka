name: Forhåndsvisning på /next/

# Publiserer til GitHub Pages fra denne grenen uten å flette til main:
# roten er main sin index.html, kopiert uendret; /next/ er det delte bygget fra denne grenen.
# Neste publisering fra main fjerner /next/ igjen (kjør denne på nytt for å få den tilbake).
on:
  push:
    branches: [claude/one-url-assets]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}next/

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sjekker uten nettleser
        run: npm run check

      - name: Bygg /next/
        run: node build.mjs --split | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Roten = main sin index.html, uendret
        run: |
          mkdir -p _site/next
          git fetch --depth=1 origin main
          if git cat-file -e FETCH_HEAD:index.html 2>/dev/null; then
            git show FETCH_HEAD:index.html > _site/index.html
            echo "rot: index.html fra main ($(git rev-parse --short FETCH_HEAD)), $(wc -c < _site/index.html) byte" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node build.mjs && cp index.html _site/
            echo "rot: main har ingen innsjekket index.html, bygget fra denne grenen" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cp -r dist/. _site/next/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
