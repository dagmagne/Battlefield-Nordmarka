<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1420">
<title>Løypemaskin – Nordmarka groomer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1420;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef3f8}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#load,#err{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,#1c3350,#0b1420 70%);z-index:20;padding:24px;text-align:center}
#load h1,#err h1{margin:0;font-weight:600;font-size:26px;letter-spacing:.02em}
#bar{width:min(320px,70vw);height:4px;border-radius:2px;background:#ffffff22;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#e9f2ff;transition:width .15s}
#msg{opacity:.7;font-size:13px}
#err{display:none}
#err p{max-width:520px;margin:0;opacity:.85;font-size:15px}
#err ul{text-align:left;max-width:520px;margin:0;padding-left:20px;opacity:.85}
#err code{background:#ffffff18;padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="load"><h1>Løypemaskin</h1><div id="bar"><i></i></div><div id="msg">Starting…</div></div>
<div id="err"><h1>WebGPU is not available</h1><p id="errp"></p>
<ul>
<li><b>Chrome / Edge</b> 113+ on macOS, Windows or ChromeOS; Chrome 121+ on Android 12+</li>
<li><b>Safari</b> 26+ on macOS Tahoe, iOS / iPadOS 26</li>
<li><b>Firefox</b> 141+ on Windows, 145+ on macOS</li>
<li>The page must be served over <code>https://</code> or from <code>localhost</code></li>
</ul></div>
<script>/*__JS__*/</script>
</body>
</html>
